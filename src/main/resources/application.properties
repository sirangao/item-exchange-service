spring.application.name=itemExchange
server.port=9090

spring.config.import=optional:file:.env[.properties]

# Origin allowed to call the API directly. Unused while the React dev server proxies
# /api to this port (same-origin), needed once the built frontend is hosted elsewhere.
app.cors.allowed-origin=http://localhost:3000

# MySQL Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/web_exchange
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true


